name: agents

on:
  push:
    branches: [agent-accounts]
    paths:
      - backend/**
      - mcp/**
      - .github/workflows/agents.yml

permissions:
  contents: read

concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dragons
          POSTGRES_PASSWORD: dragons_local_only
          POSTGRES_DB: dragons_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragons"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dragons:dragons_local_only@127.0.0.1:5432/dragons_market
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24.21.0
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run test:database
        working-directory: backend
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp

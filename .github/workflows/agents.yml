name: applications

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - mcp/**
      - web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - Caddyfile
      - .node-version
      - .dockerignore
      - deploy/railway/**
      - .github/workflows/**
  pull_request:
    branches: [main]
    # A required check must report even for documentation-only PRs.

permissions:
  contents: read

concurrency:
  group: applications-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dragons
          POSTGRES_PASSWORD: dragons_local_only
          POSTGRES_DB: dragons_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragons"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dragons:dragons_local_only@127.0.0.1:5432/dragons_market
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: node --check deploy/railway/configure.mjs
      - run: node --test deploy/railway/*.test.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:database
      - run: pnpm test:release
      - name: Install PostgreSQL 18 backup clients
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18 age
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pnpm --filter dragons-market-backend test:backup
      - run: pnpm build
      - name: Install the pinned Caddy browser-test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          curl --fail --location --retry 2 --max-time 120 https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz -o "$RUNNER_TEMP/caddy/caddy.tar.gz"
          printf '%s  %s\n' '0e85544340290a16ce4bfb76fe7d65e9de1bf3a6e67f5ccfff30b30d27ea4c73e078077b7bf3e58ae60b6b12e44327705287059c775bca5782e8ee85ea7edd75' "$RUNNER_TEMP/caddy/caddy.tar.gz" | sha512sum -c -
          tar --no-same-owner -xzf "$RUNNER_TEMP/caddy/caddy.tar.gz" -C "$RUNNER_TEMP/caddy" caddy
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      - run: pnpm --filter web exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter web test:csp

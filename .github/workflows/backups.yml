name: Backup audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-backup-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'SHC-Labs/DragonsMarket' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .node-version
      - name: Verify backup retention and freshness without deploying
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node deploy/railway/backup-audit.mjs

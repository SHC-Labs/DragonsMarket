name: contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: contracts

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: clippy-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock', 'contracts/rust-toolchain.toml') }}
          restore-keys: clippy-${{ runner.os }}-
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Contracts for wasm
        run: >
          cargo clippy -p oracle -p council -p market -p upgrade -p mock-ft -p mock-nft
          --target wasm32-unknown-unknown -- -D warnings
      - name: Everything, tests included
        run: cargo clippy --workspace --all-targets -- -D warnings

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: unit-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock', 'contracts/rust-toolchain.toml') }}
          restore-keys: unit-${{ runner.os }}-
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test -p market -p oracle -p council -p upgrade

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: web/.node-version
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: sandbox-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock', 'contracts/rust-toolchain.toml') }}
          restore-keys: sandbox-${{ runner.os }}-
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cargo/bin/cargo-near
          key: cargo-near-0.22.0-${{ runner.os }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the system libraries cargo-near links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev
      - name: Install cargo-near
        run: cargo near --version 2>/dev/null | grep -q 0.22.0 || cargo install cargo-near --version 0.22.0 --locked
      - name: Build the wasm the sandbox tests load
        run: ./build.sh
      - name: Build the NEAR Intents verifier the sandbox tests load
        # The tests fail with this recipe when the file is missing (docs/contracts/INTENTS-PROOF.md). Needs docker.
        run: |
          git clone https://github.com/near/intents "$RUNNER_TEMP/intents-src"
          git -C "$RUNNER_TEMP/intents-src" checkout 16d04f6ec4401263f8914638710260da50bb46b0
          (cd "$RUNNER_TEMP/intents-src/contracts/defuse" && cargo near build reproducible-wasm --out-dir "$RUNNER_TEMP/intents-repro")
          mkdir -p target/intents
          cp "$RUNNER_TEMP/intents-repro/defuse.wasm" target/intents/defuse.wasm
          echo "a1afab98916d9f213746544dcf8e4e6bdb22c0be6bc5dfbd8ea8814c9922b547  target/intents/defuse.wasm" | sha256sum --check
      - name: Sandbox tests
        # near-workspaces downloads the nearcore sandbox binary itself the first time it runs. Sandbox chain time follows
        # the wall clock, so on a 2 core runner many parallel sandboxes slow each transaction until a short dispute
        # window closes mid-test. Two threads keep the tests inside their windows.
        run: cargo test -p tests -- --test-threads=2
      - name: Record the sha256 of each wasm
        run: sha256sum target/near/*/*.wasm | tee wasm-sha256.txt
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: wasm-sha256-sandbox-build
          path: contracts/wasm-sha256.txt

  keeper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: web/.node-version
      - run: node --test keeper/keeper.test.mjs keeper/treasury.test.mjs

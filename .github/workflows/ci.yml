name: contracts

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Run Clippy and every compiled-contract sandbox shard as well as quick checks
        type: boolean
        default: false
      paid_private_checks:
        description: Allow full private validation; can consume hundreds of runner minutes
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: contracts

jobs:
  changes:
    if: >-
      (github.repository == 'SHC-Labs/DragonsMarket' && github.event.repository.private == false) ||
      github.repository == 'SHC-Labs/Dragons-Market'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    outputs:
      contracts: ${{ steps.paths.outputs.contracts }}
      chain: ${{ steps.paths.outputs.chain }}
      keeper: ${{ steps.paths.outputs.keeper }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .node-version
      - name: Select quick checks or explicit full validation
        id: paths
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_FULL: ${{ inputs.full || false }}
          CI_PAID_PRIVATE: ${{ inputs.paid_private_checks || false }}
        run: node .github/scripts/ci-scope.mjs

  clippy:
    needs: changes
    if: needs.changes.outputs.chain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: clippy-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock', 'contracts/rust-toolchain.toml') }}
          restore-keys: clippy-${{ runner.os }}-
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Contracts for wasm
        run: >
          cargo clippy -p oracle -p council -p market -p rounds -p dpm -p price-signatures -p upgrade -p mock-ft -p mock-nft
          --target wasm32-unknown-unknown -- -D warnings
      - name: Everything, tests included
        run: cargo clippy --workspace --all-targets -- -D warnings

  unit:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: unit-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock', 'contracts/rust-toolchain.toml') }}
          restore-keys: unit-${{ runner.os }}-
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo test -p market -p oracle -p council -p rounds -p dpm -p price-signatures -p upgrade

  sandbox:
    needs: changes
    if: needs.changes.outputs.chain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: web/.node-version
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: >-
            sandbox-nodebug-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock',
            'contracts/rust-toolchain.toml', 'contracts/tests/fixtures/council-v5-source.tar.gz') }}
          restore-keys: sandbox-nodebug-${{ runner.os }}-
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cargo/bin/cargo-near
          key: cargo-near-0.22.0-${{ runner.os }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the system libraries cargo-near links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev
      - name: Install cargo-near
        run: cargo near --version 2>/dev/null | grep -q 0.22.0 || cargo install cargo-near --version 0.22.0 --locked
      - name: Build the version 5 Council migration fixture
        if: needs.changes.outputs.contracts == 'true'
        run: bash build-council-v5.sh
      - name: Build the wasm the sandbox tests load
        run: ./build.sh
      - name: Build the NEAR Intents verifier the sandbox tests load
        # The tests fail with this recipe when the file is missing (docs/contracts/INTENTS-PROOF.md). Needs docker.
        run: |
          if echo "a1afab98916d9f213746544dcf8e4e6bdb22c0be6bc5dfbd8ea8814c9922b547  target/intents/defuse.wasm" | sha256sum --check --status; then
            echo 'Using the checksum-verified cached NEAR Intents fixture'
            exit 0
          fi
          git clone https://github.com/near/intents "$RUNNER_TEMP/intents-src"
          git -C "$RUNNER_TEMP/intents-src" checkout 16d04f6ec4401263f8914638710260da50bb46b0
          (cd "$RUNNER_TEMP/intents-src/contracts/defuse" && cargo near build reproducible-wasm --out-dir "$RUNNER_TEMP/intents-repro")
          mkdir -p target/intents
          cp "$RUNNER_TEMP/intents-repro/defuse.wasm" target/intents/defuse.wasm
          echo "a1afab98916d9f213746544dcf8e4e6bdb22c0be6bc5dfbd8ea8814c9922b547  target/intents/defuse.wasm" | sha256sum --check
      - name: Sandbox tests
        if: needs.changes.outputs.contracts == 'true'
        # near-workspaces downloads the nearcore sandbox binary itself the first time it runs. Sandbox chain time follows
        # the wall clock, so on a 2 core runner many parallel sandboxes slow each transaction until a short dispute
        # window closes mid-test. Two threads keep the tests inside their windows. With debug info the test binaries
        # fill the runner's disk.
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        # Partition every Cargo integration target, including newly added ones. Keep
        # two sandbox processes per runner; increasing threads breaks timed disputes.
        run: node run-sandbox-shard.mjs ${{ matrix.shard }} 8
      - name: Agent, keeper and DAO integration with the compiled contracts
        if: matrix.shard == 0
        working-directory: .
        run: |
          npm install --global pnpm@10.33.0
          pnpm install --frozen-lockfile --filter dragons-market-backend...
          pnpm --filter dragons-market-backend test:agent-chain
      - name: Record the sha256 of each wasm
        run: sha256sum target/near/*/*.wasm | tee wasm-sha256.txt
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: wasm-sha256-sandbox-build-${{ matrix.shard }}
          path: contracts/wasm-sha256.txt
          retention-days: 7

  keeper:
    needs: changes
    if: needs.changes.outputs.keeper == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: web/.node-version
      - run: node --test verify-build.test.mjs run-sandbox-shard.test.mjs keeper/*.test.mjs

  contract-checks:
    if: >-
      always() && ((github.repository == 'SHC-Labs/DragonsMarket' && github.event.repository.private == false) ||
      github.repository == 'SHC-Labs/Dragons-Market')
    needs: [changes, clippy, unit, sandbox, keeper]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require every applicable contract check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            import { requireContractChecks } from "./.github/scripts/ci-scope.mjs";
            requireContractChecks(JSON.parse(process.env.RESULTS));
          '

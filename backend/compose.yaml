name: dragons-market-backend
x-backend-build: &backend_build
  context: ..
  dockerfile: backend/Dockerfile
x-backend-environment: &backend_environment
  DATABASE_URL: postgresql://dm_api_login:${API_DB_PASSWORD:-dragons_api_local_only}@postgres:5432/${POSTGRES_DB:-dragons_market}
  HOST: 0.0.0.0
  PORT: 3500
  NETWORK: ${NETWORK:-mainnet}
  DEPLOYMENT_ID: ${DEPLOYMENT_ID:-}
  DEPLOYMENT_START_BLOCK: ${DEPLOYMENT_START_BLOCK:-}
  MARKET_CONTRACT_ID: ${MARKET_CONTRACT_ID:-}
  ROUNDS_CONTRACT_ID: ${ROUNDS_CONTRACT_ID:-}
  ORACLE_CONTRACT_ID: ${ORACLE_CONTRACT_ID:-}
  COUNCIL_CONTRACT_ID: ${COUNCIL_CONTRACT_ID:-}
  VERIFIER_CONTRACT_ID: ${VERIFIER_CONTRACT_ID:-}
  COLLATERAL_TOKEN_ID: ${COLLATERAL_TOKEN_ID:-}
  COLLATERAL_DECIMALS: ${COLLATERAL_DECIMALS:-6}
  RPC_URL: ${RPC_URL:-}
  RPC_ARCHIVAL_URL: ${RPC_ARCHIVAL_URL:-}
  RPC_PRIMARY_BEARER_TOKEN: ${RPC_PRIMARY_BEARER_TOKEN:-}
  RPC_SECOND_URL: ${RPC_SECOND_URL:-}
  RPC_SECOND_BEARER_TOKEN: ${RPC_SECOND_BEARER_TOKEN:-}
  RPC_TIMEOUT_MS: ${RPC_TIMEOUT_MS:-10000}
  RPC_INTERVAL_MS: ${RPC_INTERVAL_MS:-1000}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3400}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
  TRUSTED_PROXY_ADDRESSES: ${TRUSTED_PROXY_ADDRESSES:-}
  OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
  SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-604800}
  SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-43200}
  POLICY_TERMS_HASH: ${POLICY_TERMS_HASH:-}
  POLICY_PRIVACY_HASH: ${POLICY_PRIVACY_HASH:-}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dragons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dragons_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-dragons_market}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: *backend_build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dragons}:${POSTGRES_PASSWORD:-dragons_local_only}@postgres:5432/${POSTGRES_DB:-dragons_market}
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
  roles:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-dragons}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dragons_local_only}
      PGDATABASE: ${POSTGRES_DB:-dragons_market}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-dragons_api_local_only}
      INDEXER_DB_PASSWORD: ${INDEXER_DB_PASSWORD:-dragons_indexer_local_only}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-dragons_worker_local_only}
      PUBLISHER_DB_PASSWORD: ${PUBLISHER_DB_PASSWORD:-dragons_publisher_local_only}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-dragons_agent_local_only}
    volumes:
      - ./ops/roles.sql:/roles.sql:ro
      - ./ops/login-roles.sh:/login-roles.sh:ro
    command: ["sh", "/login-roles.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build: *backend_build
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      <<: *backend_environment
      AGENT_WORKER_URL: ${AGENT_WORKER_URL:-}
      AGENT_WORKER_TOKEN: ${AGENT_WORKER_TOKEN:-}
    ports:
      - "127.0.0.1:${PORT:-3500}:3500"
    depends_on:
      roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3500/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
  agent-worker:
    build: *backend_build
    profiles: [agents]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    env_file:
      - path: .env.agent-worker
        required: false
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql://dm_agent_login:${AGENT_DB_PASSWORD:-dragons_agent_local_only}@postgres:5432/${POSTGRES_DB:-dragons_market}
      AGENT_WORKER_HOST: 0.0.0.0
      AGENT_WORKER_TOKEN: ${AGENT_WORKER_TOKEN:-}
    command: [node, dist/src/agent-worker.js]
    depends_on:
      roles:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3510/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
  indexer:
    build: *backend_build
    profiles: [indexing]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql://dm_indexer_login:${INDEXER_DB_PASSWORD:-dragons_indexer_local_only}@postgres:5432/${POSTGRES_DB:-dragons_market}
    command: [node, dist/src/ingestion/follow.js]
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: unless-stopped
  feed:
    build: *backend_build
    profiles: [indexing]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql://dm_worker_login:${WORKER_DB_PASSWORD:-dragons_worker_local_only}@postgres:5432/${POSTGRES_DB:-dragons_market}
    command: [node, dist/src/ingestion/feed.js, --follow]
    volumes:
      - ./.local/feeds:/app/.local/feeds
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: unless-stopped
  reconcile:
    build: *backend_build
    profiles: [indexing]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql://dm_worker_login:${WORKER_DB_PASSWORD:-dragons_worker_local_only}@postgres:5432/${POSTGRES_DB:-dragons_market}
    command: [node, dist/src/reconcile.js, --follow]
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: unless-stopped
  verify-chain:
    build: *backend_build
    profiles: [indexing]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql://dm_worker_login:${WORKER_DB_PASSWORD:-dragons_worker_local_only}@postgres:5432/${POSTGRES_DB:-dragons_market}
    command: [node, dist/src/verify-chain.js, --follow]
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: unless-stopped
  publisher:
    build: *backend_build
    profiles: [publishing]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql://dm_publisher_login:${PUBLISHER_DB_PASSWORD:-dragons_publisher_local_only}@postgres:5432/${POSTGRES_DB:-dragons_market}
      PUBLISHER_KEY_FILE: /run/secrets/publisher_key
      PUBLISH_ROUND_PRICES: ${PUBLISH_ROUND_PRICES:-}
      PRICE_MAX_DEVIATION_BPS: ${PRICE_MAX_DEVIATION_BPS:-}
    command: [node, dist/src/round-publisher.js]
    volumes:
      - ./.local/publisher.key:/run/secrets/publisher_key:ro
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: unless-stopped
  prices:
    build: *backend_build
    profiles: [prices]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      <<: *backend_environment
      DATABASE_URL: postgresql://dm_worker_login:${WORKER_DB_PASSWORD:-dragons_worker_local_only}@postgres:5432/${POSTGRES_DB:-dragons_market}
      COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
      COINMARKETCAP_MODE: ${COINMARKETCAP_MODE:-keyless}
      COINMARKETCAP_API_KEY: ${COINMARKETCAP_API_KEY:-}
    command: [node, dist/src/prices.js, --follow]
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:

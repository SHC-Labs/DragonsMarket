[workspace]
members = ["mock-ft", "mock-nft", "mock-mt-receiver", "council", "market", "oracle", "tests", "upgrade"]
resolver = "2"

[workspace.dependencies]
near-sdk = "5.29.1"
near-contract-standards = "5.29.1"
near-workspaces = "0.23.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
